<svg width="600" height="250" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RCT-X Rhondda Marketplace Logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com');
      
      .t { font-family: 'Outfit', 'Arial Rounded MT Bold', sans-serif; text-anchor: middle; }
      
      /* Dynamic color shifting for RCT- */
      .r-text { 
        font-weight: 900; 
        font-size: 90px; 
        letter-spacing: 2px; 
        animation: colorShift 8s infinite; 
      }
      
      /* Solid dark gray for the tagline to pop on white */
      .tagline { 
        font-size: 32px; 
        fill: #222; 
        font-weight: 700; 
        letter-spacing: 1px; 
      }
      
      @keyframes colorShift {
        0%, 100% { fill: #ff5522; }
        25% { fill: #ffbb00; }
        50% { fill: #00ccaa; }
        75% { fill: #4499ff; }
      }

      /* Distinctive Pink for the X */
      .x-standout {
          fill: #ff00aa;
          transform-origin: center center;
          animation: highlightX 4s infinite ease-in-out;
      }
      
      @keyframes highlightX {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.05); }
      }

      /* Subtle wave animation */
      .wave {
        stroke: #ff5522;
        stroke-width: 5;
        fill: none;
        stroke-linecap: round;
        opacity: 0.8;
      }
    </style>
  </defs>

  <!-- Main Brand Text -->
  <g class="t" font-weight="900" font-size="90">
    <text x="265" y="120" class="r-text">RCT-</text>
    <text x="390" y="120" class="x-standout">X</text>
  </g>
  
  <!-- Tagline -->
  <text x="300" y="170" class="t tagline">Rhondda's Marketplace</text>

  <!-- Clean Accent Wave -->
  <path class="wave" d="M180 200q60 12 120 0t120 0">
    <animate attributeName="d" 
             values="M180 200q60 12 120 0t120 0; 
                     M180 200q60 -12 120 0t120 0; 
                     M180 200q60 12 120 0t120 0" 
             dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
