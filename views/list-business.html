<div class="list-business-page">
  <header>
    <h1>List Your Business</h1>
    <p>Fill in the details below to get your business listed in our directory.</p>
  </header>

  <form id="listBusinessForm">
    <label>
      Business Name *
      <input type="text" name="businessName" required>
    </label>

    <label>
      Category *
      <select name="category" required>
        <option value="">Select a category</option>
        <option value="plumber">Plumber</option>
        <option value="cleaner">Cleaner</option>
        <option value="gardener">Gardener</option>
        <option value="tutor">Tutor</option>
        <option value="mechanic">Mechanic</option>
        <option value="beauty">Beauty</option>
        <option value="handyman">Handyman</option>
        <option value="removals">Removals</option>
        <option value="webdesign">Web Design</option>
      </select>
    </label>

    <label>
      Phone
      <input type="text" name="phone">
    </label>

    <label>
      Website
      <input type="text" name="website" placeholder="https://">
    </label>

    <label>
      Area / Postcode
      <input type="text" name="area">
    </label>

    <label>
      Short Description
      <textarea name="description"></textarea>
    </label>

    <label>
      Logo URL
      <input type="text" name="logo" placeholder="Optional">
    </label>

    <button type="submit">Submit Business</button>
  </form>
</div>
