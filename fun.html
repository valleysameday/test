<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>RCT-X GeoDrop — Guess the Place</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
* { box-sizing:border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

body {
  margin:0;
  background:#020617;
  color:#e5e7eb;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header {
  padding:12px 14px;
  border-bottom:1px solid #1e293b;
  background:#020617;
}

header h1 {
  font-size:18px;
  margin:0;
}

header p {
  font-size:13px;
  margin:4px 0 0;
  color:#94a3b8;
}

#modeToggle {
  margin-top:8px;
  display:flex;
  gap:6px;
  font-size:12px;
  align-items:center;
}

#modeToggle button {
  flex:1;
  padding:6px 8px;
  border-radius:999px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  cursor:pointer;
  font-size:12px;
}

#modeToggle button.active {
  background:#2563eb;
  border-color:#2563eb;
}

main {
  flex:1;
  display:flex;
  flex-direction:column;
  padding:10px;
  gap:10px;
}

#imageWrap {
  position:relative;
  border-radius:14px;
  overflow:hidden;
  background:#020617;
  border:1px solid #1e293b;
  min-height:220px;
}

#placeImage {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:blur(10px);
  transform:scale(1.05);
  transition:filter 0.4s ease, transform 0.4s ease;
}

#imageWrap.revealed #placeImage {
  filter:blur(0);
  transform:scale(1);
}

#overlayLabel {
  position:absolute;
  left:10px;
  bottom:10px;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(15,23,42,0.85);
  font-size:11px;
  color:#e5e7eb;
}

#controls {
  display:flex;
  flex-direction:column;
  gap:8px;
}

#guessRow {
  display:flex;
  gap:8px;
}

#guessInput {
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-size:14px;
  outline:none;
}

button.primary {
  padding:10px 14px;
  border-radius:10px;
  border:none;
  background:#22c55e;
  color:white;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  font-size:14px;
}

button.secondary {
  padding:8px 12px;
  border-radius:999px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-size:12px;
  cursor:pointer;
}

#status {
  font-size:13px;
  color:#e5e7eb;
}

#status span.sub {
  display:block;
  font-size:11px;
  color:#94a3b8;
  margin-top:2px;
}

#scoreRow {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:#94a3b8;
  margin-top:4px;
}

#scoreRow strong {
  color:#e5e7eb;
}
</style>
</head>

<body>

<header>
  <h1>🎯 RCT-X GeoDrop</h1>
  <p>Guess where you’ve been dropped — world or Rhondda.</p>
  <div id="modeToggle">
    <button id="worldBtn" class="active">🌍 World</button>
    <button id="rhonddaBtn">🏔️ Rhondda</button>
  </div>
</header>

<main>
  <div id="imageWrap">
    <img id="placeImage" src="" alt="Mystery location">
    <div id="overlayLabel">Tap “Drop Me” to start</div>
  </div>

  <div id="controls">
    <div id="guessRow">
      <input id="guessInput" placeholder="Type your guess (e.g. Italy, Treorchy)">
      <button class="primary" id="dropBtn">🎲 Drop Me</button>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="secondary" id="revealBtn">👀 Reveal</button>
      <button class="secondary" id="skipBtn">⏭️ Skip</button>
    </div>
    <div id="status">Ready when you are.</div>
    <div id="scoreRow">
      <div>Score: <strong id="score">0</strong></div>
      <div>Rounds played: <strong id="rounds">0</strong></div>
    </div>
  </div>
</main>

<script>
const worldLocations = [
  {
    name: "Tokyo, Japan",
    answer: "japan",
    img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=1200&q=80"
  },
  {
    name: "New York City, USA",
    answer: "usa",
    img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1200&q=80"
  },
  {
    name: "Sydney, Australia",
    answer: "australia",
    img: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?auto=format&fit=crop&w=1200&q=80"
  },
  {
    name: "Paris, France",
    answer: "france",
    img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1200&q=80"
  },
  {
    name: "Cairo, Egypt",
    answer: "egypt",
    img: "https://images.unsplash.com/photo-1588361861040-ac9b1018f6d1?auto=format&fit=crop&w=1200&q=80"
  }
];

const rhonddaLocations = [
  {
    name: "Treorchy High Street, Rhondda",
    answer: "treorchy",
    img: "https://images.unsplash.com/photo-1521292270410-a8c53642e9d0?auto=format&fit=crop&w=1200&q=80"
  },
  {
    name: "Penpych, Rhondda",
    answer: "penpych",
    img: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
  },
  {
    name: "Bwlch Mountain Road",
    answer: "bwlch",
    img: "https://images.unsplash.com/photo-1500534314211-0a24cd03f2c0?auto=format&fit=crop&w=1200&q=80"
  },
  {
    name: "Rhondda Valley Hills",
    answer: "rhondda",
    img: "https://images.unsplash.com/photo-1500534318100-bbd07f2f4f43?auto=format&fit=crop&w=1200&q=80"
  }
];

let mode = "world";
let current = null;
let score = 0;
let rounds = 0;
let revealed = false;

const worldBtn = document.getElementById("worldBtn");
const rhonddaBtn = document.getElementById("rhonddaBtn");
const placeImage = document.getElementById("placeImage");
const overlayLabel = document.getElementById("overlayLabel");
const guessInput = document.getElementById("guessInput");
const dropBtn = document.getElementById("dropBtn");
const revealBtn = document.getElementById("revealBtn");
const skipBtn = document.getElementById("skipBtn");
const statusEl = document.getElementById("status");
const scoreEl = document.getElementById("score");
const roundsEl = document.getElementById("rounds");
const imageWrap = document.getElementById("imageWrap");

function setMode(newMode) {
  mode = newMode;
  worldBtn.classList.toggle("active", mode === "world");
  rhonddaBtn.classList.toggle("active", mode === "rhondda");
  statusEl.textContent = mode === "world"
    ? "World mode: guess the country."
    : "Rhondda mode: guess the place.";
  overlayLabel.textContent = "Tap “Drop Me” to start";
  imageWrap.classList.remove("revealed");
  placeImage.src = "";
  current = null;
  guessInput.value = "";
}

function getPool() {
  return mode === "world" ? worldLocations : rhonddaLocations;
}

function randomLocation() {
  const pool = getPool();
  return pool[Math.floor(Math.random() * pool.length)];
}

function startRound() {
  current = randomLocation();
  revealed = false;
  imageWrap.classList.remove("revealed");
  placeImage.src = current.img;
  overlayLabel.textContent = mode === "world" ? "Where in the world is this?" : "Where in the Rhondda is this?";
  statusEl.textContent = "Make your guess, then hit Reveal.";
  guessInput.value = "";
  guessInput.focus();
}

function normalise(str) {
  return (str || "").toLowerCase().trim();
}

function reveal() {
  if (!current) {
    statusEl.textContent = "Hit “Drop Me” first.";
    return;
  }
  if (revealed) return;

  revealed = true;
  imageWrap.classList.add("revealed");
  const guess = normalise(guessInput.value);
  const correct = normalise(current.answer);

  let msg;
  if (!guess) {
    msg = `You didn’t guess. It was: ${current.name}`;
  } else if (guess === correct || correct.includes(guess) || guess.includes(correct)) {
    score += 100;
    msg = `✅ Nice! You were right — ${current.name}`;
  } else {
    msg = `❌ Close, but no. It was: ${current.name}`;
  }

  rounds += 1;
  scoreEl.textContent = score;
  roundsEl.textContent = rounds;
  statusEl.innerHTML = `${msg}<span class="sub">Tap “Drop Me” to play again.</span>`;
}

worldBtn.addEventListener("click", () => setMode("world"));
rhonddaBtn.addEventListener("click", () => setMode("rhondda"));
dropBtn.addEventListener("click", startRound);
revealBtn.addEventListener("click", reveal);
skipBtn.addEventListener("click", () => {
  if (!current) {
    startRound();
  } else {
    rounds += 1;
    roundsEl.textContent = rounds;
    statusEl.textContent = `Skipped. It was: ${current.name}. New round started.`;
    startRound();
  }
});

guessInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    reveal();
  }
});

// initial state
setMode("world");
</script>

</body>
</html>
